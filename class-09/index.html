<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 9 – Study Guides</title>
<style>
/* ===== Similar Triangles – shared kit CSS ===== */
:root{
  --bg:#f4f7fb; --surface:#ffffff; --surface2:#f1f5f9; --text:#1e293b; --muted:#64748b;
  --primary:#0f766e; --primary-soft:#ccfbf1; --primary-ink:#134e4a;
  --accent:#d97706; --accent-soft:#fef3c7; --accent-ink:#78350f;
  --blue:#2563eb; --blue-soft:#dbeafe; --green:#16a34a; --green-soft:#dcfce7;
  --red:#dc2626; --red-soft:#fee2e2; --purple:#7c3aed; --purple-soft:#ede9fe;
  --border:#dbe2ea; --radius:14px; --shadow:0 2px 12px rgba(15,23,42,.07);
  --svgbg:#ffffff; --grid:#e2e8f0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --surface:#1e293b; --surface2:#273548; --text:#e2e8f0; --muted:#94a3b8;
    --primary:#2dd4bf; --primary-soft:#134e4a; --primary-ink:#ccfbf1;
    --accent:#fbbf24; --accent-soft:#4a3410; --accent-ink:#fde68a;
    --blue:#60a5fa; --blue-soft:#1e3a8a; --green:#4ade80; --green-soft:#14532d;
    --red:#f87171; --red-soft:#7f1d1d; --purple:#a78bfa; --purple-soft:#3b1f7a;
    --border:#334155; --shadow:0 2px 12px rgba(0,0,0,.35); --svgbg:#0b1220; --grid:#1f2b3d;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --surface:#1e293b; --surface2:#273548; --text:#e2e8f0; --muted:#94a3b8;
  --primary:#2dd4bf; --primary-soft:#134e4a; --primary-ink:#ccfbf1;
  --accent:#fbbf24; --accent-soft:#4a3410; --accent-ink:#fde68a;
  --blue:#60a5fa; --blue-soft:#1e3a8a; --green:#4ade80; --green-soft:#14532d;
  --red:#f87171; --red-soft:#7f1d1d; --purple:#a78bfa; --purple-soft:#3b1f7a;
  --border:#334155; --shadow:0 2px 12px rgba(0,0,0,.35); --svgbg:#0b1220; --grid:#1f2b3d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,"Noto Sans","Noto Sans Malayalam",Ubuntu,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.25;margin:1.4em 0 .5em;color:var(--primary-ink)}
h1{font-size:1.9rem;margin-top:.4em}
h2{font-size:1.45rem;border-bottom:3px solid var(--primary-soft);padding-bottom:.25em}
h3{font-size:1.15rem}
p{margin:.6em 0}
ul,ol{padding-left:1.4em}
li{margin:.25em 0}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em}
img,svg{max-width:100%}
.ml{color:var(--purple);font-weight:600}
.term{font-weight:700;color:var(--primary-ink)}
.muted{color:var(--muted)}
.small{font-size:.9em}
.center{text-align:center}
sup{font-size:.7em}
/* square roots */
.sqrt{display:inline-flex;align-items:flex-start;vertical-align:baseline;line-height:1.15;white-space:nowrap}
.sqrt>.rad{font-size:1.2em;line-height:1;margin-right:-.06em;transform:translateY(-.02em)}
.sqrt>.rnd{border-top:1.5px solid currentColor;padding:0 .18em 0 .12em;line-height:1.15}
.sqrt .frac{line-height:1}
/* fractions */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.math{font-family:"Cambria Math","Times New Roman",Georgia,serif;font-style:italic;font-size:1.05em}
.eq{display:block;text-align:center;font-family:"Cambria Math","Times New Roman",Georgia,serif;font-size:1.2em;margin:.8em 0;padding:.5em;background:var(--surface2);border-radius:10px}
/* layout */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
header.top .wrap{max-width:1040px;margin:0 auto;padding:.5rem 16px;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
header.top .home{font-weight:700;color:var(--primary-ink);display:flex;align-items:center;gap:.4rem;font-size:1rem}
header.top .spacer{flex:1}
header.top select{max-width:min(46vw,380px);padding:.35rem .5rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.9rem}
.navbtn{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .7rem;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.9rem;white-space:nowrap}
.navbtn:hover{background:var(--primary-soft);text-decoration:none}
.navbtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.navbtn.disabled{opacity:.4;pointer-events:none}
main.page{max-width:1040px;margin:0 auto;padding:1rem 16px 3rem}
.lead{font-size:1.1rem;color:var(--muted)}
.chip{display:inline-block;padding:.15rem .6rem;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);font-size:.8rem;font-weight:600;margin-right:.3rem}
.chip.amber{background:var(--accent-soft);color:var(--accent-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
footer.bottomnav{max-width:1040px;margin:0 auto;padding:1rem 16px 2.5rem;display:flex;gap:.6rem;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border)}
footer.bottomnav label{display:flex;align-items:center;gap:.4rem;font-size:.95rem;cursor:pointer}
/* cards & callouts */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin:1rem 0;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.grid .card{margin:0}
.callout{border-left:6px solid var(--primary);background:var(--primary-soft);border-radius:10px;padding:.8rem 1rem;margin:1rem 0}
.callout .title{font-weight:700;margin-bottom:.3rem;display:flex;align-items:center;gap:.4rem}
.callout.key{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.callout.key .title{color:var(--accent-ink)}
.callout.real{border-color:var(--green);background:var(--green-soft)}
.callout.think{border-color:var(--blue);background:var(--blue-soft)}
.callout.warn{border-color:var(--red);background:var(--red-soft)}
.callout.book{border-color:var(--purple);background:var(--purple-soft)}
.callout p:first-child{margin-top:0}.callout p:last-child{margin-bottom:0}
details.card{padding:.6rem 1rem}
details summary{cursor:pointer;font-weight:700;color:var(--primary-ink);padding:.3rem 0}
details[open] summary{margin-bottom:.4rem}
/* interactive lab */
.lab{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem;margin:1rem 0;box-shadow:var(--shadow)}
.lab .lab-title{font-weight:700;color:var(--primary-ink);display:flex;align-items:center;gap:.4rem;margin:.1rem 0 .5rem}
.lab svg{display:block;width:100%;height:auto;background:var(--svgbg);border-radius:10px;border:1px solid var(--border);touch-action:none;user-select:none}
.lab .hint{font-size:.9rem;color:var(--muted);margin:.4rem 0 0}
.controls{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin:.6rem 0}
.controls label{display:flex;align-items:center;gap:.5rem;font-size:.95rem}
.controls input[type=range]{width:min(220px,50vw);accent-color:var(--primary)}
.controls output{font-weight:700;min-width:3ch;color:var(--primary-ink)}
.btn{padding:.45rem .9rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.95rem;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--primary-soft)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.readout{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);border-radius:8px;padding:.5rem .8rem;margin:.5rem 0;font-size:.95rem;line-height:1.5;white-space:pre-wrap}
.split{display:grid;grid-template-columns:1fr;gap:.8rem}
@media(min-width:820px){.split{grid-template-columns:3fr 2fr;align-items:start}}
/* stepper */
.stepper .step-controls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0}
.stepper .step-count{font-weight:700;color:var(--primary-ink);padding:0 .4rem}
.step-list{list-style:none;padding:0;margin:.4rem 0 0;max-height:300px;overflow:auto;border-top:1px dashed var(--border)}
.step-list li{padding:.5rem .7rem;margin:.25rem 0;border-radius:8px;background:var(--surface2);border-left:4px solid transparent;font-size:.97rem}
.step-list li.active{background:var(--accent-soft);border-left-color:var(--accent);animation:pop .35s ease}
@keyframes pop{from{transform:translateX(-4px);opacity:.4}to{transform:none;opacity:1}}
/* SVG semantic classes */
svg .tri-big{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2.2;stroke-linejoin:round}
svg .tri-small{fill:var(--green-soft);stroke:var(--green);stroke-width:2.2;stroke-linejoin:round}
svg .tri-amber{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
svg .tri-red{fill:var(--red-soft);stroke:var(--red);stroke-width:2.2;stroke-linejoin:round}
svg .tri-purple{fill:var(--purple-soft);stroke:var(--purple);stroke-width:2.2;stroke-linejoin:round}
svg .tri-none{fill:none;stroke:var(--text);stroke-width:2;stroke-linejoin:round}
svg .ln{stroke:var(--text);stroke-width:2;stroke-linecap:round;fill:none}
svg .ln-blue{stroke:var(--blue);stroke-width:2.2;stroke-linecap:round;fill:none}
svg .ln-green{stroke:var(--green);stroke-width:2.2;stroke-linecap:round;fill:none}
svg .ln-red{stroke:var(--red);stroke-width:2.2;stroke-linecap:round;fill:none}
svg .ln-amber{stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;fill:none}
svg .ln-purple{stroke:var(--purple);stroke-width:2.2;stroke-linecap:round;fill:none}
svg .ln-muted{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;fill:none}
svg .thin{stroke-width:1.2}
svg .thick{stroke-width:3.2}
svg .dash{stroke-dasharray:6 5}
svg .dot{stroke-dasharray:2 4}
svg .lbl{fill:var(--text);font-size:15px;font-family:"Segoe UI",Roboto,Arial,sans-serif;paint-order:stroke;stroke:var(--svgbg);stroke-width:3px;stroke-linejoin:round}
svg .lbl.big{font-size:18px;font-weight:700}
svg .lbl.sm{font-size:12px}
svg .lbl.i{font-style:italic;font-family:"Cambria Math","Times New Roman",Georgia,serif;font-size:17px}
svg .lbl.blue{fill:var(--blue)}svg .lbl.green{fill:var(--green)}svg .lbl.red{fill:var(--red)}svg .lbl.amber{fill:var(--accent)}svg .lbl.purple{fill:var(--purple)}svg .lbl.muted{fill:var(--muted)}
svg .ang{fill:none;stroke:var(--red);stroke-width:2}
svg .ang.blue{stroke:var(--blue)}svg .ang.green{stroke:var(--green)}svg .ang.amber{stroke:var(--accent)}svg .ang.purple{stroke:var(--purple)}
svg .ang-fill{fill:var(--red);opacity:.18;stroke:none}
svg .ang-fill.blue{fill:var(--blue)}svg .ang-fill.green{fill:var(--green)}svg .ang-fill.amber{fill:var(--accent)}svg .ang-fill.purple{fill:var(--purple)}
svg .ang-lbl{fill:var(--red);font-size:13px;font-family:"Segoe UI",Roboto,Arial,sans-serif;paint-order:stroke;stroke:var(--svgbg);stroke-width:3px;stroke-linejoin:round}
svg .ang-lbl.blue{fill:var(--blue)}svg .ang-lbl.green{fill:var(--green)}svg .ang-lbl.amber{fill:var(--accent)}svg .ang-lbl.purple{fill:var(--purple)}
svg .pt{fill:var(--text);stroke:var(--svgbg);stroke-width:1.5}
svg .pt.drag{fill:var(--accent);r:7;stroke:var(--surface);stroke-width:2;cursor:grab}
svg .pt.blue{fill:var(--blue)}svg .pt.green{fill:var(--green)}svg .pt.red{fill:var(--red)}
svg .grid line{stroke:var(--grid);stroke-width:1}
svg .fill-blue{fill:var(--blue-soft)}svg .fill-green{fill:var(--green-soft)}svg .fill-amber{fill:var(--accent-soft)}svg .fill-red{fill:var(--red-soft)}svg .fill-purple{fill:var(--purple-soft)}svg .fill-none{fill:var(--svgbg)}svg .fill-surface{fill:var(--surface2)}
svg .hl-blue{fill:var(--blue-soft);stroke:var(--blue)!important;stroke-width:2!important}svg .hl-green{fill:var(--green-soft);stroke:var(--green)!important;stroke-width:2!important}svg .hl-amber{fill:var(--accent-soft);stroke:var(--accent)!important;stroke-width:2!important}svg .hl-red{fill:var(--red-soft);stroke:var(--red)!important;stroke-width:2!important}svg .hl-purple{fill:var(--purple-soft);stroke:var(--purple)!important;stroke-width:2!important}
svg .ground{stroke:var(--muted);stroke-width:2}
svg .sun{fill:#fbbf24}
/* quiz */
.quiz{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;margin:1rem 0}
.quiz .q{font-weight:600;margin-bottom:.6rem}
.quiz .opts{display:grid;gap:.4rem}
.quiz .opt{text-align:left;padding:.5rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;color:var(--text);font-size:.97rem}
.quiz .opt:hover{background:var(--primary-soft)}
.quiz .opt.right{background:var(--green-soft);border-color:var(--green)}
.quiz .opt.wrong{background:var(--red-soft);border-color:var(--red)}
.quiz .fb{margin-top:.6rem;font-size:.95rem;min-height:1.2em}
.quiz .fb.ok{color:var(--green)}.quiz .fb.no{color:var(--red)}
.quiz input[type=text],.quiz input[type=number]{padding:.4rem .6rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:1rem;width:9rem}
/* tables */
table{border-collapse:collapse;width:100%;margin:.8rem 0;font-size:.97rem}
th,td{border:1px solid var(--border);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:var(--surface2)}
/* progress on index */
.toc-list{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.toc-list a.item{display:flex;gap:.8rem;align-items:center;padding:.7rem .9rem;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.toc-list a.item:hover{border-color:var(--primary);text-decoration:none;transform:translateY(-1px)}
.toc-list .num{font-weight:800;color:var(--primary);min-width:2.2rem;font-size:1.1rem}
.toc-list .desc{color:var(--muted);font-size:.9rem}
.toc-list .done{margin-left:auto;font-size:1.2rem}
.onpage{background:var(--surface2);border-radius:10px;padding:.6rem .9rem;margin:.8rem 0;font-size:.93rem;display:flex;flex-wrap:wrap;gap:.3rem .9rem;align-items:center}
.onpage b{margin-right:.2rem}
.onpage a{white-space:nowrap}
/* print */
@media print{
  header.top,footer.bottomnav,.noprint,.step-controls{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  main.page{max-width:none;padding:0}
  .card,.lab,.quiz,.callout{box-shadow:none;break-inside:avoid}
}
@media(max-width:600px){body{font-size:16px}h1{font-size:1.5rem}h2{font-size:1.25rem}}


.crumbs{font-size:.92rem;margin:.2rem 0 1rem;color:var(--muted)}
.crumbs a{font-weight:600}
.hero{background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));border-radius:var(--radius);padding:1.4rem;margin:.6rem 0 1.4rem;border:1px solid var(--border)}
.hero h1{margin:.1rem 0 .4rem}.hero p{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0 2rem}
a.tile{display:flex;flex-direction:column;gap:.35rem;padding:1.1rem 1.2rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
a.tile:hover{text-decoration:none;border-color:var(--primary);transform:translateY(-2px)}
.tile .big{font-size:2rem;line-height:1}
.tile .t{font-weight:800;font-size:1.15rem;color:var(--primary-ink)}
.tile .d{color:var(--muted);font-size:.93rem}
.tile .meta{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.3rem;font-size:.85rem;color:var(--muted)}
.tile .num{display:inline-flex;align-items:center;justify-content:center;min-width:2.1rem;height:2.1rem;border-radius:50%;background:var(--primary);color:#fff;font-weight:800}
.bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--border);flex:1}
.bar>div{height:100%;background:var(--green);width:0}
.soon{border:1px dashed var(--border);border-radius:var(--radius);padding:1rem 1.2rem;color:var(--muted)}
footer.site{max-width:1040px;margin:0 auto;padding:1rem 16px 2.5rem;color:var(--muted);font-size:.88rem;border-top:1px solid var(--border)}

</style>
</head>
